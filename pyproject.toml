[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-guard"
version = "0.1.0"
description = "Detecta cambios incompatibles entre especificaciones OpenAPI 3.x"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Héctor Daniel Marmolejo García" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["openapi", "api", "compatibility", "breaking-changes", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
contract-guard = "contract_guard.cli:main"

[tool.setuptools.packages.find]
include = ["contract_guard*"]
