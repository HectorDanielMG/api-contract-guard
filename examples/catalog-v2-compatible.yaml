openapi: 3.0.3
info:
  title: API de catálogo
  version: 1.1.0
paths:
  /products:
    get:
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /health:
    get:
      responses:
        '200':
          description: Estado del servicio
components:
  schemas:
    Product:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]
        description:
          type: string
    CreateProduct:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
