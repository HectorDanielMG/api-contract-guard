name: Verificar compatibilidad de API

on:
  pull_request:
    paths:
      - "api/openapi.yaml"
      - "contract_guard/**"
      - "pyproject.toml"
      - ".github/workflows/contract-check.yml"
  push:
    branches: [main]
    paths:
      - "api/openapi.yaml"
      - "contract_guard/**"
      - "pyproject.toml"
      - ".github/workflows/contract-check.yml"

permissions:
  contents: read

jobs:
  compare-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio y su historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Contract Guard
        run: python -m pip install .

      - name: Comparar con la rama base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if ! git cat-file -e "${BASE_SHA}:api/openapi.yaml" 2>/dev/null; then
            echo "No existe una versión anterior del contrato; se registra el contrato inicial."
            exit 0
          fi

          git show "${BASE_SHA}:api/openapi.yaml" > "$RUNNER_TEMP/openapi-before.yaml"
          set +e
          contract-guard compare \
            "$RUNNER_TEMP/openapi-before.yaml" \
            api/openapi.yaml \
            --format markdown \
            --output "$RUNNER_TEMP/compatibility-report.md" \
            --fail-on-breaking
          result=$?
          set -e
          cat "$RUNNER_TEMP/compatibility-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
